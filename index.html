<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turu Wis Wengi!</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border: 6px dashed #ff6b6b;
            border-radius: 35px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        /* Warna-warni lucu per kata */
        .c1 { color: #ff4757; }
        .c2 { color: #ffa502; }
        .c3 { color: #2ed573; }
        .c4 { color: #1e90ff; }
        .c5 { color: #9b59b6; }

        .emoji {
            font-size: 3.5rem;
            display: block;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes bounce {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-15px) rotate(1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>
            <span class="c1">Turu</span> 
            <span class="c2">wis</span> 
            <span class="c3">wengi</span> <br>
            <span class="c4">Hendry</span> 
            <span class="c5">primantoro</span>
        </h1>
        <span class="emoji">😴🌙✨</span>
    </div>

</body>
</html>
